<!DOCTYPE html><html><head><meta charset="utf-8"><style>
*{box-sizing:border-box;margin:0;padding:0}
body{width:1080px;background:#FBF8F2;font-family:"Microsoft YaHei","PingFang SC",sans-serif;color:#26312F;overflow:hidden}
</style></head><body>
<div style="padding:36px 40px 30px;width:1080px;background:#FBF8F2">
  <div style="font-size:16px;color:#3F5A62;letter-spacing:2px;margin-bottom:10px">同样一句提示词</div>
  <div style="font-size:40px;font-weight:700;margin-bottom:28px">两种交付，差的不止一个格式</div>
  <div style="display:flex;gap:22px">
    <div style="flex:1;background:#FFFFFF;border:1px solid #E5DFD0;border-radius:14px;padding:26px 24px">
      <div style="font-size:26px;font-weight:700;color:#7A7A72;margin-bottom:6px">路径 A · AI 交一份 PPT</div>
      <div style="font-size:18px;color:#999;margin-bottom:18px">生成 PPTX → 再导入希沃</div>
      <div style="font-size:21px;color:#26312F;line-height:1.9;padding-left:4px"><span style="color:#9A9A90;font-weight:700;margin-right:8px">×</span>汉字卡 → 退化成一张图片</div><div style="font-size:21px;color:#26312F;line-height:1.9;padding-left:4px"><span style="color:#9A9A90;font-weight:700;margin-right:8px">×</span>思维导图 → 不会逐级展开</div><div style="font-size:21px;color:#26312F;line-height:1.9;padding-left:4px"><span style="color:#9A9A90;font-weight:700;margin-right:8px">×</span>课堂活动 → 只剩静态截图</div><div style="font-size:21px;color:#26312F;line-height:1.9;padding-left:4px"><span style="color:#9A9A90;font-weight:700;margin-right:8px">×</span>导入之后，看着像课件，用起来像图片</div>
    </div>
    <div style="flex:1;background:#FFFFFF;border:2px solid #B4472B;border-radius:14px;padding:26px 24px">
      <div style="font-size:26px;font-weight:700;color:#B4472B;margin-bottom:6px">路径 B · AI 连进希沃</div>
      <div style="font-size:18px;color:#999;margin-bottom:18px">直接生成客户端原生 .enbx</div>
      <div style="font-size:21px;color:#26312F;line-height:1.9;padding-left:4px"><span style="color:#B4472B;font-weight:700;margin-right:8px">✓</span>汉字卡 → 能发音、能分步看笔顺</div><div style="font-size:21px;color:#26312F;line-height:1.9;padding-left:4px"><span style="color:#B4472B;font-weight:700;margin-right:8px">✓</span>思维导图 → 学生可以逐层点开</div><div style="font-size:21px;color:#26312F;line-height:1.9;padding-left:4px"><span style="color:#B4472B;font-weight:700;margin-right:8px">✓</span>课堂活动 → 真的能上台点选</div><div style="font-size:21px;color:#26312F;line-height:1.9;padding-left:4px"><span style="color:#B4472B;font-weight:700;margin-right:8px">✓</span>交互还在，才是教室里的课件</div>
    </div>
  </div>
  <div style="margin-top:24px;background:#B4472B;border-radius:10px;padding:16px 22px;font-size:22px;color:#FFFFFF;font-weight:700">
    分水岭不是「有没有生成课件」，而是「教室里的交互还在不在」
  </div>
</div></body></html>
