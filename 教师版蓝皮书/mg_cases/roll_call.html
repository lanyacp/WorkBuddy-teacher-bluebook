<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>课堂随机点名器</title>
<style>
 html,body{margin:0;padding:0;font-family:"Microsoft YaHei",sans-serif;background:#f4f7ff;min-height:100vh}
 .box{max-width:860px;margin:0 auto;padding:26px 22px 50px}
 h1{text-align:center;color:#1d3a8f;font-size:26px;margin:8px 0 4px;letter-spacing:1px}
 .sub{text-align:center;color:#6b7db3;font-size:14px;margin-bottom:18px}
 textarea{width:100%;height:150px;border:2px solid #c4d3f5;border-radius:12px;padding:12px;font-size:16px;
  font-family:inherit;box-sizing:border-box;background:#fff;resize:vertical}
 textarea:focus{outline:none;border-color:#2f7cf6}
 .row{display:flex;gap:12px;margin-top:14px;flex-wrap:wrap;justify-content:center}
 button{border:none;border-radius:12px;padding:14px 30px;font-size:19px;font-family:inherit;cursor:pointer;transition:.15s}
 #btnGo{background:#2f7cf6;color:#fff;flex:1;max-width:320px;font-weight:700}
 #btnGo:hover{background:#4a90ff}
 #btnGo:disabled{background:#9db8e0;cursor:default}
 .stage{text-align:center;margin-top:26px;min-height:220px}
 #name{font-size:88px;font-weight:800;color:#1d3a8f;line-height:1.15;transition:.08s}
 .rolling{color:#2f7cf6}
 #result{margin-top:10px;font-size:16px;color:#44598f;min-height:24px}
 .panes{display:flex;gap:16px;margin-top:24px;flex-wrap:wrap}
 .pane{flex:1;min-width:240px;background:#fff;border:1.5px solid #dbe5fb;border-radius:14px;padding:14px 16px}
 .pane h3{margin:0 0 8px;font-size:15px;color:#44598f}
 .pane .names{font-size:15px;line-height:1.9;color:#22315e;min-height:60px;word-break:break-all}
 .done{color:#a8b6d8}
 .stat{margin-top:18px;text-align:center;color:#6b7db3;font-size:14px}
 kbd{background:#e8eefc;border-radius:5px;padding:1px 7px;border:1px solid #c4d3f5;font-size:13px}
</style>
</head>
<body>
<div class="box">
 <h1>🎯 课堂随机点名器</h1>
 <div class="sub">名单只存在本机浏览器里（localStorage），不上传任何服务器 · 快捷键 <kbd>空格</kbd> 开始/停止</div>
 <textarea id="names" placeholder="把班级名单粘贴到这里，一行一个名字…&#10;例如：&#10;张一帆&#10;李思远&#10;王雨桐"></textarea>
 <div class="row">
  <button id="btnGo" disabled>▶ 开始点名</button>
 </div>
 <div class="stage">
  <div id="name">—</div>
  <div id="result">粘贴名单后即可开始</div>
 </div>
 <div class="panes">
  <div class="pane"><h3>✅ 已点到</h3><div class="names" id="doneList">（还没有）</div></div>
  <div class="pane"><h3>⏳ 未点到</h3><div class="names" id="restList">（还没有）</div></div>
 </div>
 <div class="stat" id="stat"></div>
</div>
<script>
const $=id=>document.getElementById(id);
const KEY='rollcall_names_v1';
let pool=[],done=[],rolling=false,timer=null,idxHist=[];
function save(){localStorage.setItem(KEY,JSON.stringify({pool,done}));}
function load(){try{const d=JSON.parse(localStorage.getItem(KEY));if(d){pool=d.pool||[];done=d.done||[];}}catch(e){}
 if(pool.length)$('names').value=pool.join('\n');render();}
function parse(){const v=$('names').value.split('\n').map(s=>s.trim()).filter(Boolean);
 const changed=v.join('|')!==pool.join('|');
 pool=v;if(changed)done=[];$('btnGo').disabled=!pool.length;save();render();}
function render(){
 $('doneList').textContent=done.length?done.join('、'):'（还没有）';
 $('doneList').className='names'+(done.length?' done':'');
 $('restList').textContent=pool.filter(n=>!done.includes(n)).join('、')||'（都点过啦，重新开始吧）';
 const total=pool.length||1;
 $('stat').textContent=pool.length?('已点 '+done.length+' / '+pool.length+' 人（'+Math.round(done.length/total*100)+'%）'):'';
 if(!rolling)$('result').textContent=pool.length?(done.length?'继续点名或重置':'一切就绪，点「开始」抽第一位'):'粘贴名单后即可开始';}
function pick(){const rest=pool.filter(n=>!done.includes(n));if(!rest.length){stop('本轮全班都点过啦！点「重置」开始新一轮');return null;}
 /* 加权：从未被点过的孩子概率加倍，减少“总点不到”的情况 */
 const w=rest.map(n=>idxHist.includes(n)?1:2),sum=w.reduce((a,b)=>a+b,0);
 let r=Math.random()*sum;for(let i=0;i<rest.length;i++){r-=w[i];if(r<=0)return rest[i];}
 return rest[rest.length-1];}
function start(){const n=pick();if(!n)return;rolling=true;$('btnGo').textContent='⏹ 停止';$('name').className='rolling';
 timer=setInterval(()=>{const rest=pool.filter(x=>!done.includes(x));const x=rest[Math.floor(Math.random()*rest.length)]||pool[0];
  $('name').textContent=x;},70);}
function stop(msg){rolling=false;clearInterval(timer);$('btnGo').textContent='▶ 开始点名';$('name').className='';
 const cur=$('name').textContent;if(cur&&cur!=='—'&&!done.includes(cur)){done.push(cur);idxHist.push(cur);}save();render();
 if(msg)$('result').textContent=msg;else $('result').textContent='本次点到：'+cur+'　（已自动记入“已点到”）';}
$('btnGo').onclick=()=>rolling?stop():start();
$('names').oninput=parse;
document.addEventListener('keydown',e=>{if(e.code==='Space'&&document.activeElement!==$('names')){e.preventDefault();if(!$('btnGo').disabled)(rolling?stop():start());}});
load();
</script>
</body>
</html>
