<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DNA 双螺旋 · 3D 模型预览</title>
<script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.5.0/model-viewer.min.js"></script>
<style>
  html,body{margin:0;height:100%;background:#0f172a;font-family:"Microsoft YaHei",system-ui,sans-serif;}
  header{padding:14px 22px;color:#e2e8f0;}
  h1{font-size:17px;margin:0;font-weight:600;}
  p{margin:5px 0 0;font-size:12.5px;color:#94a3b8;}
  model-viewer{width:100%;height:calc(100% - 74px);background:#0f172a;--poster-color:transparent;}
</style>
</head>
<body>
<header>
  <h1>DNA 双螺旋 · 高中生物「DNA 的结构」</h1>
  <p>拖拽旋转看大沟小沟　·　数一圈碱基对　·　双指平移</p>
</header>
<model-viewer
  src="dna.glb"
  alt="DNA 双螺旋 3D 模型"
  camera-controls
  auto-rotate
  auto-rotate-delay="800"
  rotation-per-second="12deg"
  shadow-intensity="1"
  exposure="1"
  camera-orbit="-25deg 74deg 110%"
  min-camera-orbit="auto auto 40%">
</model-viewer>
</body>
</html>
