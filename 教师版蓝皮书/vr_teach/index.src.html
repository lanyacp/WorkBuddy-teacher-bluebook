<!-- ============ 全景图占位块 ============
     源文件里这三块是空的；运行 build.py 后，图片会被转成 base64 填进这里，
     生成的 index.html 才是"双击即用、零依赖"的成品。
     （file:// 协议下外链图片会被浏览器判为跨源，WebGL 拒绝上传 → 全黑） -->
<script id="pano_1" type="text/plain"></script>
<script id="pano_2" type="text/plain"></script>
<script id="pano_3" type="text/plain"></script>

<script>
/* ============================================================
   零依赖全景引擎：手写 WebGL 球面渲染 + 热点投影
   不装任何东西、不联网、双击即开
   ============================================================ */
const $ = s => document.querySelector(s);
const cv = $('#cv');
const stage = $('#stage');
let DATA = JSON.parse($('#content').textContent);

/* ---------- WebGL 球面 ---------- */
const gl = cv.getContext('webgl', { antialias: true, alpha: false });
if (!gl) { document.body.innerHTML = '<p style="color:#fff;padding:40px;font-size:18px">这个浏览器不支持 WebGL，请换 Chrome 或 Edge。</p>'; }

const VS = `
attribute vec3 aPos; attribute vec2 aUv;
uniform mat4 uRot; uniform mat4 uProj;
varying vec2 vUv;
void main(){ vUv = aUv;
  gl_Position = uProj * uRot * vec4(aPos,1.0); }`;

const FS = `
precision mediump float;
uniform sampler2D uTex; varying vec2 vUv;
void main(){ gl_FragColor = texture2D(uTex, vUv); }`;

function sh(type, src){
  const s = gl.createShader(type);
  gl.shaderSource(s, src); gl.compileShader(s);
  if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(s));
  return s;
}
const prog = gl.createProgram();
gl.attachShader(prog, sh(gl.VERTEX_SHADER, VS));
gl.attachShader(prog, sh(gl.FRAGMENT_SHADER, FS));
gl.linkProgram(prog);
gl.useProgram(prog);

const aPos = gl.getAttribLocation(prog, 'aPos');
const aUv = gl.getAttribLocation(prog, 'aUv');
const uRot = gl.getUniformLocation(prog, 'uRot');
const uProj = gl.getUniformLocation(prog, 'uProj');
const uTex = gl.getUniformLocation(prog, 'uTex');

// 球面网格（等距柱状投影）
// 约定：u = 图片横向百分比（0=最左，50=初始正前方），v = 图片纵向百分比（0=最上）
// 顶点坐标：th = u/100*2π，ph = v/100*π
const LON = 72, LAT = 36;
const pos = [], uvs = [], idx = [];
for (let i = 0; i <= LAT; i++){
  const phi = i / LAT * Math.PI;
  for (let j = 0; j <= LON; j++){
    const th = j / LON * Math.PI * 2;
    pos.push(-Math.sin(th) * Math.sin(phi), Math.cos(phi), Math.cos(th) * Math.sin(phi));
    uvs.push(j / LON, i / LAT);
  }
}
for (let i = 0; i < LAT; i++) for (let j = 0; j < LON; j++){
  const a = i * (LON + 1) + j, b = a + LON + 1;
  idx.push(a, b, a + 1, a + 1, b, b + 1);
}
const vb = gl.createBuffer();
gl.bindBuffer(gl.ARRAY_BUFFER, vb);
gl.bufferData(gl.ARRAY_BUFFER, new Float32Array(pos), gl.STATIC_DRAW);
const vb2 = gl.createBuffer();
gl.bindBuffer(gl.ARRAY_BUFFER, vb2);
gl.bufferData(gl.ARRAY_BUFFER, new Float32Array(uvs), gl.STATIC_DRAW);
const ib = gl.createBuffer();
gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER, ib);
gl.bufferData(gl.ELEMENT_ARRAY_BUFFER, new Uint16Array(idx), gl.STATIC_DRAW);
// 注意：vertexAttribPointer 会"捕获"当前绑定的 ARRAY_BUFFER，
// 所以两个属性必须各自先 bindBuffer 再设指针，否则 aPos 会读到 UV 数据、三角形退化 → 全黑。
gl.bindBuffer(gl.ARRAY_BUFFER, vb);
gl.enableVertexAttribArray(aPos);
gl.vertexAttribPointer(aPos, 3, gl.FLOAT, false, 0, 0);
gl.bindBuffer(gl.ARRAY_BUFFER, vb2);
gl.enableVertexAttribArray(aUv);
gl.vertexAttribPointer(aUv, 2, gl.FLOAT, false, 0, 0);
gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER, ib);

// 透视投影（列主序）
// 关键：clip.w 必须等于 -z（相机在原点看 -Z），
// 这样 clip.x/clip.w = (t/asp)*x/(-z)，与下面 project() 的公式严格一致，
// 否则画面和热点投影会对不上。
// 同时保证 ndc.z ∈ [-1,1]，否则会被深度范围裁掉 → 画面全黑且不报 GL 错误。
function perspective(fov, asp, n, f){
  const t = 1 / Math.tan(fov / 2);
  const m22 = -(f + n) / (f - n);
  const m23 = -2 * f * n / (f - n);
  return new Float32Array([
    t / asp, 0, 0, 0,
    0, t, 0, 0,
    0, 0, m22, -1,
    0, 0, m23, 0
  ]);
}

// 旋转矩阵：Ry(yaw) * Rx(pitch)，列主序
let yaw = 0, pitch = 0;
const ROT = new Float32Array(16);
function buildRot(){
  const cy = Math.cos(yaw), sy = Math.sin(yaw);
  const cp = Math.cos(pitch), sp = Math.sin(pitch);
  ROT.set([
    cy,  sp * sy,  cp * sy, 0,
    0,   cp,     -sp,     0,
    -sy, sp * cy, cp * cy, 0,
    0,0,0,1
  ]);
}
buildRot();

/* ---------- 纹理加载 ---------- */
let tex = null;

/* 图片来源解析：
   1) 成品（index.html）里 <script id="pano_1"> 已内嵌 base64 → 直接用；
   2) 源文件（index.src.html）里是空的 → 回退到 assets/ 原图；
      但 file:// 下外链图会被浏览器判为跨源，WebGL 拒绝上传 → 走占位图 + 提示。 */
function resolveSrc(src){
  const el = document.getElementById(src);
  if (el){
    const t = el.textContent.trim();
    if (t.startsWith('data:')) return t;
  }
  if (/^pano_\d+$/.test(src)) return 'assets/' + src + '.jpg';
  return src;
}

/* 占位纹理：即使图片没加载成功，画面也不是纯黑，而是网格底图 + 说明 */
function placeholderTexture(){
  const c = document.createElement('canvas');
  c.width = 512; c.height = 256;
  const x = c.getContext('2d');
  const g = x.createLinearGradient(0, 0, 0, 256);
  g.addColorStop(0, '#243650'); g.addColorStop(.5, '#44536e'); g.addColorStop(1, '#1b2230');
  x.fillStyle = g; x.fillRect(0, 0, 512, 256);
  x.strokeStyle = 'rgba(255,255,255,.10)'; x.lineWidth = 1;
  for (let i = 0; i <= 16; i++){ x.beginPath(); x.moveTo(i*32, 0); x.lineTo(i*32, 256); x.stroke(); }
  for (let i = 0; i <= 8;  i++){ x.beginPath(); x.moveTo(0, i*32); x.lineTo(512, i*32); x.stroke(); }
  x.textAlign = 'center';
  x.fillStyle = 'rgba(255,255,255,.82)'; x.font = 'bold 21px sans-serif';
  x.fillText('全景图未加载', 256, 120);
  x.fillStyle = 'rgba(255,255,255,.55)'; x.font = '13px sans-serif';
  x.fillText('开发模式（源文件）', 256, 146);
  return c;
}

function uploadTexture(source){
  if (tex) gl.deleteTexture(tex);
  tex = gl.createTexture();
  gl.bindTexture(gl.TEXTURE_2D, tex);
  // FLIP_Y 必须为 false：WebGL 默认 t=0 对应图像顶行，
  // 而我们用 s = 纬度(ph/π) 采样，ph=0 是北极（图像顶部），正好对上。
  // 设成 true 会导致画面上下颠倒。
  gl.pixelStorei(gl.UNPACK_FLIP_Y_WEBGL, false);
  gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, gl.RGBA, gl.UNSIGNED_BYTE, source);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.REPEAT);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
  $('#devbar').style.display = 'none';
}

function loadTex(src){
  const url = resolveSrc(src);
  const im = new Image();
  im.onload = () => {
    try {
      uploadTexture(im);
    } catch (e) {
      uploadTexture(placeholderTexture());
      showDev('全景图被浏览器拦截，无法上传为纹理。<br><b>' + e.message + '</b><br>'
             + '本地双击打开时必须使用<b>内嵌图片的成品版</b>（即运行 build.py 生成的 index.html）。');
    }
  };
  im.onerror = () => {
    uploadTexture(placeholderTexture());
    showDev('找不到全景图：<b>' + url + '</b><br>请检查 assets 目录与文件名是否一致。');
  };
  im.src = url;
}

function showDev(html){
  const d = $('#devbar');
  d.innerHTML = html;
  d.style.display = 'block';
}

function resize(){
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  cv.width = innerWidth * dpr; cv.height = innerHeight * dpr;
  gl.viewport(0, 0, cv.width, cv.height);
}
addEventListener('resize', resize);
resize();

const FOV = 78 * Math.PI / 180;
function draw(){
  if (!tex) { requestAnimationFrame(draw); return; }
  buildRot();
  gl.uniformMatrix4fv(uRot, false, ROT);
  gl.uniformMatrix4fv(uProj, false, perspective(FOV, cv.width / cv.height, 0.1, 100));
  gl.activeTexture(gl.TEXTURE0);
  gl.bindTexture(gl.TEXTURE_2D, tex);
  gl.uniform1i(uTex, 0);
  gl.drawElements(gl.TRIANGLES, idx.length, gl.UNSIGNED_SHORT, 0);
  updateHots();
  requestAnimationFrame(draw);
}
requestAnimationFrame(draw);

/* ---------- 热点投影：球面坐标 → 屏幕坐标 ----------
   必须和着色器里的 uRot（列主序 Ry(yaw)*Rx(pitch)）逐项对齐，
   否则热点会整体偏移 / 被误判为"在身后"。
   矩阵按行读出：
     row0 = ( cy,     0,   -sy )
     row1 = ( sp*sy,  cp,  sp*cy )
     row2 = ( cp*sy, -sp,  cp*cy )                        */
function project(u, v){
  const th = (u / 100) * Math.PI * 2;
  const ph = (v / 100) * Math.PI;
  const s  = Math.sin(ph);
  const px = -Math.sin(th) * s;
  const py = Math.cos(ph);
  const pz =  Math.cos(th) * s;

  const cy = Math.cos(yaw), sy = Math.sin(yaw);
  const cp = Math.cos(pitch), sp = Math.sin(pitch);
  const rx = cy * px - sy * pz;
  const ry = sp * sy * px + cp * py + sp * cy * pz;
  const rz = cp * sy * px - sp * py + cp * cy * pz;

  if (rz > -0.02) return null;                 // 在身后 → 不显示
  const t = 1 / Math.tan(FOV / 2);
  const asp = cv.width / cv.height;
  const ndcX = (rx * t / asp) / -rz;
  const ndcY = (ry * t) / -rz;
  return {
    x: (ndcX * 0.5 + 0.5) * innerWidth,
    y: (1 - (ndcY * 0.5 + 0.5)) * innerHeight,
    behind: rz
  };
}

/* ---------- 反投影：屏幕点 → 球面坐标（热点编辑模式用） ---------- */
function unproject(cx, cy){
  const t = 1 / Math.tan(FOV / 2);
  const asp = cv.width / cv.height;
  const nx = (cx / innerWidth) * 2 - 1;
  const ny = 1 - (cy / innerHeight) * 2;
  // 相机空间方向（相机看向 -Z）
  let dx = nx * asp * t, dy = ny * t, dz = -1;
  const L = Math.hypot(dx, dy, dz); dx /= L; dy /= L; dz /= L;
  // 反旋转回场景空间：Rx(-pitch) * Ry(-yaw)
  const cyw = Math.cos(yaw), syw = Math.sin(yaw);
  const cpp = Math.cos(pitch), spp = Math.sin(pitch);
  const ax = cyw * dx + syw * dz, ay = dy, az = syw * dx + cyw * dz;
  const bx = ax, by = cpp * ay + spp * az, bz = -spp * ay + cpp * az;
  // 单位球：命中点就是方向向量本身
  const ph = Math.acos(Math.max(-1, Math.min(1, by)));
  const th = Math.atan2(-bx, bz);
  let u = (th / (Math.PI * 2)) * 100;
  u = ((u % 100) + 100) % 100;
  return { u: +u.toFixed(1), v: +((ph / Math.PI) * 100).toFixed(1) };
}

/* ---------- 交互：拖动 / 滚轮 ---------- */
let dragging = false, lastX = 0, lastY = 0, moved = 0;
cv.addEventListener('pointerdown', e => {
  dragging = true; moved = 0; lastX = e.clientX; lastY = e.clientY;
  cv.classList.add('drag'); cv.setPointerCapture(e.pointerId);
});
cv.addEventListener('pointermove', e => {
  if (!dragging) return;
  const dx = e.clientX - lastX, dy = e.clientY - lastY;
  lastX = e.clientX; lastY = e.clientY;
  moved += Math.abs(dx) + Math.abs(dy);
  yaw -= dx * 0.0032;
  pitch = Math.max(-0.62, Math.min(0.62, pitch + dy * 0.0022));
});
cv.addEventListener('pointerup', e => {
  dragging = false; cv.classList.remove('drag');
  if (moved < 6 && editMode) addHotspotAt(e.clientX, e.clientY);
});
cv.addEventListener('wheel', e => {
  e.preventDefault();
  pitch = Math.max(-0.62, Math.min(0.62, pitch + e.deltaY * 0.0006));
}, { passive: false });

/* ---------- 界面渲染 ---------- */
let cur = 0;
function scene(){ return DATA.scenes[cur]; }

function renderUI(){
  $('#ttl').textContent = DATA.title;
  $('#subttl').textContent = DATA.subtitle;
  $('#pTitle').textContent = DATA.panelTitle;
  $('#pMeta').innerHTML = DATA.panelMeta || '';
  $('#pBody').innerHTML =
    (DATA.quote ? `<div class="quote">${DATA.quote}</div>` : '') +
    (DATA.paragraphs || []).map(p => `<p>${p}</p>`).join('') +
    (DATA.tip ? `<div class="tip">${DATA.tip}</div>` : '');

  const box = $('#scenes');
  box.innerHTML = '';
  DATA.scenes.forEach((s, i) => {
    const d = document.createElement('div');
    d.className = 'scn' + (i === cur ? ' on' : '');
    d.innerHTML = `<div class="ico">${s.icon || '景'}</div>${s.name}`;
    d.onclick = () => gotoScene(i);
    box.appendChild(d);
  });
}

let hotList = [];                      // 当前场景的热点 DOM 引用（不放进 JSON，避免污染导出）
function renderHots(){
  const box = $('#hots');
  box.innerHTML = '';
  hotList = [];
  const s = scene();
  (s.hotspots || []).forEach((h, i) => {
    const el = document.createElement('div');
    el.className = 'hot k' + (h.kind || 1);
    el.innerHTML = `<span class="dot">${i + 1}</span><span class="lab">${h.label || ''}</span>`;
    el.onclick = () => openCard(h);
    box.appendChild(el);
    hotList.push({ h, el });
  });
}

function updateHots(){
  hotList.forEach(({ h, el }) => {
    const p = project(h.u, h.v);
    if (!p || p.x < -140 || p.x > innerWidth + 140 || p.y < -60 || p.y > innerHeight + 60){
      el.style.display = 'none';
      return;
    }
    el.style.display = 'flex';
    el.style.left = p.x + 'px';
    el.style.top = p.y + 'px';
    // 越靠边越淡，模拟纵深
    const edge = Math.max(0, (Math.abs(p.x - innerWidth / 2) / (innerWidth / 2)));
    el.style.opacity = (1 - edge * 0.55).toFixed(2);
  });
}

function gotoScene(i){
  cur = i;
  const s = scene();
  yaw = (s.startYaw || 0) * Math.PI / 180;
  pitch = 0;
  loadTex(s.image);
  $('#subbar').textContent = s.subtitle || '';
  $('#subbar').style.display = s.subtitle ? 'block' : 'none';
  renderUI();
  renderHots();
}

/* ---------- 弹出卡片 ---------- */
function openCard(h){
  $('#cTag').textContent = h.tag || '知识点';
  $('#cTitle').textContent = h.title || '';
  $('#cBody').innerHTML = h.body || '';
  $('#card').style.display = 'block';
}
$('#cClose').onclick = () => $('#card').style.display = 'none';
$('#card').onclick = e => { if (e.target.id === 'card') $('#card').style.display = 'none'; };

/* ---------- 面板折叠 ---------- */
function togglePanel(){
  const p = $('#panel');
  p.classList.toggle('hide');
  $('#scenes').classList.toggle('hide', p.classList.contains('hide'));
  $('#titlebar').style.right = p.classList.contains('hide') ? '0px' : '392px';
  $('#tgPanel').style.right = p.classList.contains('hide') ? '12px' : '404px';
}
$('#tgPanel').onclick = togglePanel;
$('#pClose').onclick = togglePanel;

/* ---------- 内容编辑 ---------- */
$('#btnEdit').onclick = () => {
  $('#ta').value = JSON.stringify(DATA, null, 2);
  $('#modal').style.display = 'flex';
};
$('#mClose').onclick = () => $('#modal').style.display = 'none';
$('#mApply').onclick = () => {
  try {
    DATA = JSON.parse($('#ta').value);
    $('#content').textContent = JSON.stringify(DATA, null, 2);
    gotoScene(0);
    $('#modal').style.display = 'none';
    showHint('内容已更新');
  } catch (e) {
    alert('JSON 格式有误：' + e.message);
  }
};
$('#btnExport').onclick = () => {
  const b = new Blob([JSON.stringify(DATA, null, 2)], { type: 'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(b);
  a.download = '内容.json';
  a.click();
};

/* ---------- 热点编辑模式：点画面即建热点 ---------- */
let editMode = false;
$('#btnMode').onclick = () => {
  editMode = !editMode;
  $('#btnMode').classList.toggle('on', editMode);
  cv.classList.toggle('edit', editMode);
  showHint(editMode
    ? '已进入热点编辑模式<br><b>在画面上点一下</b>，即可在该位置新建热点'
    : '已退出热点编辑模式');
};
function addHotspotAt(cx, cy){
  // 屏幕点 → 反解球面坐标（与 project 严格互逆）
  const { u, v } = unproject(cx, cy);

  const label = prompt('这个热点的名称（显示在画面上的小标签）：', '新知识点');
  if (!label) return;
  const title = prompt('热点标题（点击后弹出的标题）：', label);
  const body = prompt('讲解内容：', '在这里写这个知识点的讲解。');
  const tag = prompt('分类标签（可选）：', '知识点');
  const s = scene();
  s.hotspots = s.hotspots || [];
  s.hotspots.push({ u, v, kind: 1, label, tag, title: title || label, body: body || '' });
  $('#content').textContent = JSON.stringify(DATA, null, 2);
  renderHots();
  showHint('已添加热点：<b>' + label + '</b><br>位置 u=' + u + ' v=' + v + '<br><br>点「编辑内容」可以修改讲解文字');
}

function showHint(html){
  const h = $('#hint');
  h.innerHTML = html;
  h.style.display = 'block';
  clearTimeout(h._t);
  h._t = setTimeout(() => h.style.display = 'none', 3200);
}

/* ---------- 启动 ---------- */
gotoScene(0);
</script>
</body>
